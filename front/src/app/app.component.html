<div class="app">
    <mat-toolbar color="primary" fxLayout="row" fxLayoutAlign="space-between center">
        <span>MddClient</span>
        <div *ngIf="$isLogged() | async; else notLogged">
            <span routerLink="posts" class="link">Articles</span>
            <span routerLink="topics" class="link">Sujets</span>
            <span routerLink="me" class="link">Profil</span>
            <span (click)="logout()" class="link">Se déconnecter</span>
        </div>
        <ng-template #notLogged>
            <div>
                <span routerLink="login" class="link">Se connecter</span>
                <span routerLink="register" class="link">S'inscrire</span>
            </div>
        </ng-template>
    </mat-toolbar>
    <div>
        <router-outlet></router-outlet>
    </div>
</div>
