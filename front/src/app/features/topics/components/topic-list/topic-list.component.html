<div class="list">
    <mat-card>
        <mat-card-header fxLayout="row" fxLayoutAlign="space-between center">
            <button mat-raised-button color="primary" routerLink="create">
                <span class="ml1">Créer un thème</span>
            </button>
        </mat-card-header>
        <div class="items mt2" fxLayout="row" fxLayout.lt-md="column">
            <mat-card class="item" *ngFor="let topic of (topics$ | async)" fxFlex>
                <mat-card-header>
                    <mat-card-title>{{ topic.name }}</mat-card-title>
                </mat-card-header>
                <mat-card-content>
                    <p>{{ topic.description }}</p>
                </mat-card-content>
                <mat-card-actions>
                    <button mat-raised-button color="primary" [routerLink]="['detail',topic.topic_id]">
                        <span class="ml1">S'abonner</span>
                    </button>
                </mat-card-actions>
            </mat-card>
        </div>
    </mat-card>
</div>
