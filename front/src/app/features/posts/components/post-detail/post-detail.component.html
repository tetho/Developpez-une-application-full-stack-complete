<div class="detail">
    <mat-card *ngIf="post">
        <mat-card-title>
            <div fxLayout="row" fxLayoutAlign="space-between center">
                <button mat-icon-button routerLink="/posts">
                    <mat-icon>arrow_back</mat-icon>
                </button>
                <div fxLayout="row" fxLayoutAlign="start center">
                    <h1>{{post.title | titlecase}}</h1>
                </div>
            </div>
        </mat-card-title>
        <mat-card-content>
            <div class="my2" fxLayout="row" fxLayoutAlign="space-between center">
                <div fxLayout="center">
                    <span class="ml1">Date : {{ post.updated_at | date: 'dd/MM/YYYY'}}</span>
                </div>
                <div fxLayout="center">
                    <span class="ml1">Auteur : {{ post.user_id.username }}</span>
                </div>
                <div fxLayout="center">
                    <span class="ml1">Thème : {{ post.topic_id }}</span>
                </div>
            </div>
            <div class="description">
                {{ post.content }}
            </div>
        </mat-card-content>
    </mat-card>
</div>
